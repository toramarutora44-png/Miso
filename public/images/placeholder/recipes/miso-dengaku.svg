<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#F7F3E8"/>

  <!-- grill plate -->
  <rect x="140" y="470" width="520" height="26" rx="6" fill="#3A2A1E"/>
  <g stroke="#E8752C" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M230 470 q 10 -22 0 -40"/>
    <path d="M330 470 q -10 -22 0 -40"/>
    <path d="M470 470 q 10 -22 0 -40"/>
    <path d="M570 470 q -10 -22 0 -40"/>
  </g>

  <!-- skewer A: tofu -->
  <line x1="320" y1="120" x2="320" y2="478" stroke="#8C6239" stroke-width="6" stroke-linecap="round"/>
  <rect x="278" y="210" width="84" height="96" rx="10" fill="#FDFBF5" stroke="#D8CBAA" stroke-width="3"/>
  <rect x="278" y="316" width="84" height="96" rx="10" fill="#FDFBF5" stroke="#D8CBAA" stroke-width="3"/>
  <path d="M278 210 h84 v20 q-42 18 -84 0 Z" fill="#6B4A2F"/>
  <path d="M278 316 h84 v20 q-42 18 -84 0 Z" fill="#6B4A2F"/>
  <path d="M296 234 q 24 10 48 0" fill="none" stroke="#4A3220" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M296 340 q 24 10 48 0" fill="none" stroke="#4A3220" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="300" cy="226" r="3" fill="#2F2419"/>
  <circle cx="340" cy="230" r="3" fill="#2F2419"/>

  <!-- skewer B: konnyaku -->
  <line x1="480" y1="120" x2="480" y2="478" stroke="#8C6239" stroke-width="6" stroke-linecap="round"/>
  <rect x="438" y="210" width="84" height="96" rx="6" fill="#D7D2C5" stroke="#B9B3A2" stroke-width="3"/>
  <rect x="438" y="316" width="84" height="96" rx="6" fill="#D7D2C5" stroke="#B9B3A2" stroke-width="3"/>
  <path d="M438 210 h84 v20 q-42 18 -84 0 Z" fill="#6B4A2F"/>
  <path d="M438 316 h84 v20 q-42 18 -84 0 Z" fill="#6B4A2F"/>
  <circle cx="456" cy="248" r="3" fill="#8C8572"/>
  <circle cx="500" cy="262" r="3" fill="#8C8572"/>
  <circle cx="470" cy="356" r="3" fill="#8C8572"/>
  <circle cx="500" cy="372" r="3" fill="#8C8572"/>

  <!-- sesame garnish -->
  <g fill="#FDFBF5" stroke="#8C6239" stroke-width="1.5">
    <ellipse cx="305" cy="222" rx="4" ry="2.5" transform="rotate(20 305 222)"/>
    <ellipse cx="330" cy="330" rx="4" ry="2.5" transform="rotate(-15 330 330)"/>
    <ellipse cx="460" cy="224" rx="4" ry="2.5" transform="rotate(10 460 224)"/>
